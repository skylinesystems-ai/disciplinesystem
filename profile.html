<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil - Discipline System</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

<main class="profile-page">

    <section class="profile-card">

        <section class="class-card">

            <div class="class-header">

                <span>CLASSE ATUAL</span>

                <h2>
                    SHADOW RUNNER
                </h2>

            </div>

            <div class="class-description">

                Especialista em disciplina extrema,
                consistência e evolução contínua.

            </div>

            <div class="class-bonus-grid">

                <div class="bonus-card">
                    <span>FOCO</span>
                    <strong>+12%</strong>
                </div>

                <div class="bonus-card">
                    <span>XP BOOST</span>
                    <strong>+20%</strong>
                </div>

                <div class="bonus-card">
                    <span>STREAK</span>
                    <strong>+8%</strong>
                </div>

            </div>

        </section>

        <div class="profile-avatar"></div>

        <span class="profile-class">
        SHADOW RUNNER
      </span>

        <h1>
            Mario
        </h1>

        <p>
            Evoluindo diariamente através da disciplina.
        </p>

        <div class="profile-stats">

            <div class="profile-stat">
                <span>LEVEL</span>
                <strong>12</strong>
            </div>

            <div class="profile-stat">
                <span>XP</span>
                <strong>780</strong>
            </div>

            <div class="profile-stat">
                <span>STREAK</span>
                <strong>14</strong>
            </div>

        </div>

    </section>

    <section class="attributes-card">

        <h2>
            ATRIBUTOS
        </h2>

        <div class="attribute-item">
            <span>DISCIPLINA</span>
            <div class="attribute-bar">
                <div class="attribute-fill fill-1"></div>
            </div>
        </div>

        <div class="attribute-item">
            <span>FOCO</span>
            <div class="attribute-bar">
                <div class="attribute-fill fill-2"></div>
            </div>
        </div>

        <div class="attribute-item">
            <span>RESISTÊNCIA</span>
            <div class="attribute-bar">
                <div class="attribute-fill fill-3"></div>
            </div>
        </div>

    </section>

</main>

</body>
</html>
