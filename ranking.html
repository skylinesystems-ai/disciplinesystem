<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ranking - Discipline System</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/ranking.css">

</head>

<body>

<main class="ranking-page">

    <header class="page-header">

        <span>GLOBAL SYSTEM</span>

        <h1>
            RANKING MUNDIAL
        </h1>

    </header>

    <section class="ranking-list">

        <article class="ranking-card top-player">

            <div class="rank-position">
                #1
            </div>

            <div class="player-info">

                <h2>
                    SHADOW MONARCH
                </h2>

                <p>
                    LEVEL 72
                </p>

            </div>

            <div class="xp-total">
                92.000 XP
            </div>

        </article>

        <article class="ranking-card">

            <div class="rank-position">
                #2
            </div>

            <div class="player-info">

                <h2>
                    IRON DISCIPLINE
                </h2>

                <p>
                    LEVEL 68
                </p>

            </div>

            <div class="xp-total">
                87.000 XP
            </div>

        </article>

        <article class="ranking-card">

            <div class="rank-position">
                #3
            </div>

            <div class="player-info">

                <h2>
                    NIGHT RUNNER
                </h2>

                <p>
                    LEVEL 64
                </p>

            </div>

            <div class="xp-total">
                80.000 XP
            </div>

        </article>

    </section>

</main>

</body>
</html>
