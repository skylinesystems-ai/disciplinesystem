<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Achievements - Discipline System</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/achievements.css">

</head>

<body>

<main class="achievements-page">

    <header class="page-header">

        <span>RECOMPENSAS</span>

        <h1>
            ACHIEVEMENTS
        </h1>

    </header>

    <section class="achievements-grid">

        <article class="achievement-card legendary">

            <div class="achievement-icon">
                ⚡
            </div>

            <h2>
                PRIMEIRO LEVEL UP
            </h2>

            <p>
                Alcance o nível 10.
            </p>

        </article>

        <article class="achievement-card epic">

            <div class="achievement-icon">
                🔥
            </div>

            <h2>
                STREAK MONSTER
            </h2>

            <p>
                Complete 30 dias consecutivos.
            </p>

        </article>

        <article class="achievement-card rare">

            <div class="achievement-icon">
                🛡️
            </div>

            <h2>
                IRON DISCIPLINE
            </h2>

            <p>
                Complete 100 missões.
            </p>

        </article>

    </section>

</main>

</body>
</html>
