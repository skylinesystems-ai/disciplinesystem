<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Missões - Discipline System</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/missions.css">

</head>

<body>

<main class="missions-page">

    <header class="page-header">

        <div>
            <span>SISTEMA RPG</span>
            <h1>MISSÕES DIÁRIAS</h1>
        </div>

        <button class="primary-button">
            NOVA MISSÃO
        </button>

    </header>

    <section class="missions-grid">

        <article class="mission-card">

            <div class="mission-header">

          <span class="difficulty easy">
            EASY
          </span>

                <span class="xp-tag">
            +50 XP
          </span>

            </div>

            <h2>
                BEBER 3L DE ÁGUA
            </h2>

            <p>
                Desenvolva consistência e energia.
            </p>

            <button class="mission-button">
                COMPLETAR
            </button>

        </article>

        <article class="mission-card">

            <div class="mission-header">

          <span class="difficulty medium">
            MEDIUM
          </span>

                <span class="xp-tag">
            +120 XP
          </span>

            </div>

            <h2>
                TREINO COMPLETO
            </h2>

            <p>
                Evolua sua resistência física.
            </p>

            <button class="mission-button">
                COMPLETAR
            </button>

        </article>

        <article class="mission-card">

            <div class="mission-header">

          <span class="difficulty hard">
            HARD
          </span>

                <span class="xp-tag">
            +300 XP
          </span>

            </div>

            <h2>
                ACORDAR 5H
            </h2>

            <p>
                Construa disciplina extrema.
            </p>

            <button class="mission-button">
                COMPLETAR
            </button>

        </article>

    </section>

</main>

</body>
</html>
